<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 智课精灵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', 'Noto Serif SC', serif; }
        .tcm-primary { color: #8B5A2B; }
        .tcm-accent { color: #C23B22; }
        .bg-tcm-primary { background-color: #8B5A2B; }
        .bg-tcm-accent { background-color: #C23B22; }
        .bg-tcm-light { background-color: #F9F6F0; }
        .border-tcm-primary { border-color: #8B5A2B; }
        .hover-tcm:hover { background-color: #8B5A2B; color: white; }
        .glass-card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139,90,43,0.1);
        }
        .sidebar-link {
            transition: all 0.2s;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background-color: rgba(139,90,43,0.1);
            color: #8B5A2B;
        }
        .sidebar-link.active {
            border-right: 3px solid #8B5A2B;
        }
        .stat-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139,90,43,0.15);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tcm: { primary: '#8B5A2B', accent: '#C23B22', light: '#F9F6F0' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tcm-light min-h-screen">

<!-- 顶部导航 -->
<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-amber-100 shadow-sm">

            <button onclick="doLogout()" class="text-xs text-slate-400 hover:text-red-500 ml-2">退出登录</button>

<script>
// ==================== 全局状态 ====================
const API = '';  // 同源部署，留空
let authToken = localStorage.getItem('token') || '';
let userPage = 1;
let logPage = 1;

// ==================== 认证检查 ====================
async function checkAuth() {
    if (!authToken) {
        // 没有token，显示内联登录表单而不是跳转
        showAdminLogin();
        return false;
    }
    try {
        const resp = await fetch(API + '/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        });
        if (!resp.ok) {
            localStorage.removeItem('token');
            authToken = '';
            // token失效，显示内联登录
            showAdminLogin();
            return false;
        }
        const user = await resp.json();
        if (user.role !== 'admin') {
            document.querySelector('main').innerHTML = `
                <div class="flex flex-col items-center justify-center py-20">
                    <iconify-icon icon="solar:shield-warning-linear" class="text-6xl text-amber-300 mb-4"></iconify-icon>
                    <h3 class="text-lg font-medium text-slate-600 mb-2">需要管理员权限</h3>
                    <p class="text-sm text-slate-400 mb-4">当前账号：${user.displayName || user.username}（${user.role === 'teacher' ? '教师' : '学生'}）</p>
                    <a href="tcm-dashboard.html" class="px-4 py-2 bg-tcm-primary text-white rounded-lg text-sm">返回看板</a>
                </div>`;
            return false;
        }
        document.getElementById('adminName').textContent = user.displayName || user.username;
        return true;
    } catch (e) {
        console.error('Auth check failed:', e);
        // 后端不可用时显示错误提示
        document.querySelector('main').innerHTML = `
            <div class="flex flex-col items-center justify-center py-20">
                <iconify-icon icon="solar:server-square-cloud-linear" class="text-6xl text-slate-300 mb-4"></iconify-icon>
                <h3 class="text-lg font-medium text-slate-600 mb-2">无法连接到后端服务</h3>
                <p class="text-sm text-slate-400 mb-4">请确保后端服务已启动 (node server.js)</p>
                <a href="tcm-dashboard.html" class="px-4 py-2 bg-tcm-primary text-white rounded-lg text-sm">返回看板</a>
            </div>`;
        return false;
    }
}

function showAdminLogin() {
    document.querySelector('main').innerHTML = `
        <div class="flex flex-col items-center justify-center py-16">
            <div class="w-16 h-16 bg-tcm-primary/10 rounded-2xl flex items-center justify-center mb-4">
                <iconify-icon icon="solar:shield-check-bold" class="text-3xl tcm-primary"></iconify-icon>
            </div>
            <h3 class="text-lg font-semibold text-slate-700 mb-1">管理后台登录</h3>
            <p class="text-sm text-slate-400 mb-6">请使用管理员账号登录</p>
            <div class="w-full max-w-sm space-y-3">
                <input type="text" id="adminLoginUser" placeholder="用户名" class="w-full px-4 py-2.5 border border-amber-200 rounded-lg text-sm outline-none focus:border-tcm-primary">
                <input type="password" id="adminLoginPw" placeholder="密码" class="w-full px-4 py-2.5 border border-amber-200 rounded-lg text-sm outline-none focus:border-tcm-primary" onkeydown="if(event.key==='Enter')adminDoLogin()">
                <div id="adminLoginErr" class="text-sm text-red-500 hidden"></div>
                <button onclick="adminDoLogin()" class="w-full py-2.5 bg-tcm-primary text-white rounded-lg text-sm font-semibold hover:opacity-90">登录</button>
            </div>
            <a href="tcm-dashboard.html" class="mt-6 text-sm text-slate-400 hover:tcm-primary">← 返回看板</a>
        </div>`;
}

async function adminDoLogin() {
    const username = document.getElementById('adminLoginUser').value.trim();
    const password = document.getElementById('adminLoginPw').value;
    const errEl = document.getElementById('adminLoginErr');
    if (!username || !password) {
        errEl.textContent = '请输入用户名和密码';
        errEl.classList.remove('hidden');
        return;
    }
    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await resp.json();
        if (resp.ok && data.token) {
            if (data.user.role !== 'admin') {
                errEl.textContent = '该账号不是管理员';
                errEl.classList.remove('hidden');
                return;
            }
            localStorage.setItem('token', data.token);
            authToken = data.token;
            // 刷新页面加载管理后台
            location.reload();
        } else {
            errEl.textContent = data.error || '登录失败';
            errEl.classList.remove('hidden');
        }
    } catch (e) {
        errEl.textContent = '无法连接服务器';
        errEl.classList.remove('hidden');
    }
}

// ==================== API 请求封装 ====================
function doLogout() {
    localStorage.removeItem('token');
    window.location.href = 'tcm-login.html';
}

async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    const resp = await fetch(API + path, { ...options, headers });
    if (resp.status === 401) {
        localStorage.removeItem('token');
        window.location.href = 'tcm-login.html';
        return null;
    }
    return resp.json();
}

// ==================== Tab 切换 ====================
function toggleAdminSidebar() {
    const sidebar = document.getElementById('adminSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}

function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById('tab-' + tab)?.classList.remove('hidden');
    document.querySelectorAll('.sidebar-link').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
    });
    // 加载数据
    if (tab === 'overview') loadOverview();
    else if (tab === 'users') loadUsers();
    else if (tab === 'generations') loadGenStats();
    else if (tab === 'logs') loadLogs();
    else if (tab === 'settings') loadLLMConfig();
}

// ==================== 数据总览 ====================
async function loadOverview() {
    const data = await api('/api/admin/stats/overview');
    if (!data) return;
    document.getElementById('statUsers').textContent = data.userCount || 0;
    document.getElementById('statProjects').textContent = data.projectCount || 0;
    document.getElementById('statGen').textContent = data.genCount || 0;
    document.getElementById('statToday').textContent = data.todayGen || 0;
    document.getElementById('statUploads').textContent = data.uploadCount || 0;

    // 加载图表
    const genData = await api('/api/admin/stats/generations?days=7');
    if (genData) {
        renderTrendChart(genData.byDate || []);
        renderTypeChart(genData.byType || []);
    }
}

function renderTrendChart(data) {
    const chart = echarts.init(document.getElementById('chartTrend'));
    chart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 40, right: 20, top: 20, bottom: 30 },
        xAxis: { type: 'category', data: data.map(d => d.date?.slice(5) || ''), axisLabel: { fontSize: 11 } },
        yAxis: { type: 'value', minInterval: 1, axisLabel: { fontSize: 11 } },
        series: [{
            type: 'line', data: data.map(d => d.count || 0),
            smooth: true, areaStyle: { opacity: 0.15 },
            lineStyle: { color: '#8B5A2B', width: 2 },
            itemStyle: { color: '#8B5A2B' }
        }]
    });
    window.addEventListener('resize', () => chart.resize());
}

function renderTypeChart(data) {
    const chart = echarts.init(document.getElementById('chartType'));
    const typeNames = { ppt: 'PPT', lesson: '教案', cases: '医案', quiz: '测验', knowledge: '图谱', chat: '对话' };
    const colors = ['#8B5A2B', '#C23B22', '#2D8C5A', '#5B8CDB', '#E6A23C', '#9061C0'];
    chart.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        series: [{
            type: 'pie', radius: ['40%', '70%'],
            data: data.map((d, i) => ({ name: typeNames[d.type] || d.type, value: d.count, itemStyle: { color: colors[i % colors.length] } })),
            label: { fontSize: 12 },
            emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } }
        }]
    });
    window.addEventListener('resize', () => chart.resize());
}

// ==================== 用户管理 ====================
async function loadUsers() {
    const search = document.getElementById('userSearch')?.value || '';
    const role = document.getElementById('userRoleFilter')?.value || '';
    const data = await api(`/api/admin/users?page=${userPage}&pageSize=15&search=${encodeURIComponent(search)}&role=${role}`);
    if (!data) return;

    const tbody = document.getElementById('userTableBody');
    if (data.list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-slate-400">暂无数据</td></tr>';
    } else {
        const roleLabels = { admin: '管理员', teacher: '教师', student: '学生' };
        const roleColors = { admin: 'bg-red-100 text-red-700', teacher: 'bg-blue-100 text-blue-700', student: 'bg-green-100 text-green-700' };
        tbody.innerHTML = data.list.map(u => `
            <tr class="border-t border-amber-50 hover:bg-amber-50/30">
                <td class="px-4 py-3 font-medium">${u.username}</td>
                <td class="px-4 py-3">${u.display_name || '-'}</td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs ${roleColors[u.role] || ''}">${roleLabels[u.role] || u.role}</span></td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs ${u.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">${u.status === 'active' ? '正常' : '禁用'}</span></td>
                <td class="px-4 py-3 text-slate-400">${u.last_login ? u.last_login.slice(0, 16).replace('T', ' ') : '-'}</td>
                <td class="px-4 py-3 text-slate-400">${u.created_at ? u.created_at.slice(0, 10) : '-'}</td>
                <td class="px-4 py-3 text-center">
                    <button onclick="toggleUserStatus('${u.id}','${u.status}')" class="text-xs px-2 py-1 rounded hover:bg-amber-100 tcm-primary">${u.status === 'active' ? '禁用' : '启用'}</button>
                    <button onclick="showResetPwModal('${u.id}')" class="text-xs px-2 py-1 rounded hover:bg-amber-100 text-amber-600">重置密码</button>
                    <button onclick="deleteUser('${u.id}','${u.username}')" class="text-xs px-2 py-1 rounded hover:bg-red-100 text-red-500">删除</button>
                </td>
            </tr>
        `).join('');
    }
    document.getElementById('userPagination').textContent = `第 ${data.page} 页 / 共 ${data.total} 条`;
}

function prevUserPage() { if (userPage > 1) { userPage--; loadUsers(); } }
function nextUserPage() { userPage++; loadUsers(); }

function showCreateUserModal() {
    document.getElementById('createUserModal').classList.remove('hidden');
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('newDisplayName').value = '';
    document.getElementById('newRole').value = 'student';
}
function hideCreateUserModal() { document.getElementById('createUserModal').classList.add('hidden'); }

async function createUser() {
    const body = {
        username: document.getElementById('newUsername').value,
        password: document.getElementById('newPassword').value,
        displayName: document.getElementById('newDisplayName').value,
        role: document.getElementById('newRole').value
    };
    const data = await api('/api/admin/users', { method: 'POST', body: JSON.stringify(body) });
    if (data && data.success) {
        hideCreateUserModal();
        loadUsers();
    } else {
        alert(data?.error || '创建失败');
    }
}

async function toggleUserStatus(id, currentStatus) {
    const newStatus = currentStatus === 'active' ? 'disabled' : 'active';
    const data = await api(`/api/admin/users/${id}`, { method: 'PUT', body: JSON.stringify({ status: newStatus }) });
    if (data) loadUsers();
}

function showResetPwModal(id) {
    document.getElementById('resetUserId').value = id;
    document.getElementById('resetNewPw').value = '';
    document.getElementById('resetPwModal').classList.remove('hidden');
}

async function resetPassword() {
    const id = document.getElementById('resetUserId').value;
    const pw = document.getElementById('resetNewPw').value;
    const data = await api(`/api/admin/users/${id}/reset-password`, { method: 'PUT', body: JSON.stringify({ newPassword: pw }) });
    if (data && data.success) {
        document.getElementById('resetPwModal').classList.add('hidden');
        alert('密码已重置');
    } else {
        alert(data?.error || '重置失败');
    }
}

async function deleteUser(id, username) {
    if (!confirm(`确认删除用户 ${username}？`)) return;
    const data = await api(`/api/admin/users/${id}`, { method: 'DELETE' });
    if (data) loadUsers();
}

// ==================== 生成统计 ====================
async function loadGenStats() {
    const data = await api('/api/admin/stats/generations?days=30');
    if (!data) return;

    const typeNames = { ppt: 'PPT', lesson: '教案', cases: '医案', quiz: '测验', knowledge: '图谱', chat: '对话' };
    const colors = ['#8B5A2B', '#C23B22', '#2D8C5A', '#5B8CDB', '#E6A23C', '#9061C0'];

    // 按类型饼图
    const typeChart = echarts.init(document.getElementById('chartGenType'));
    typeChart.setOption({
        tooltip: { trigger: 'item' },
        series: [{
            type: 'pie', radius: ['40%', '70%'],
            data: (data.byType || []).map((d, i) => ({ name: typeNames[d.type] || d.type, value: d.count, itemStyle: { color: colors[i % colors.length] } }))
        }]
    });

    // 按模型柱状图
    const modelChart = echarts.init(document.getElementById('chartGenModel'));
    const models = data.byModel || [];
    modelChart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 80, right: 20, top: 20, bottom: 30 },
        xAxis: { type: 'value', minInterval: 1 },
        yAxis: { type: 'category', data: models.map(m => m.model || 'unknown'), axisLabel: { fontSize: 11 } },
        series: [{ type: 'bar', data: models.map(m => m.count), itemStyle: { color: '#8B5A2B' } }]
    });

    window.addEventListener('resize', () => { typeChart.resize(); modelChart.resize(); });

    // 活跃用户
    const userData = await api('/api/admin/stats/users');
    if (userData) {
        const tbody = document.getElementById('activeUsersBody');
        tbody.innerHTML = (userData.activeUsers || []).map(u => `
            <tr class="border-t border-amber-50 hover:bg-amber-50/30">
                <td class="px-4 py-3 font-medium">${u.username}</td>
                <td class="px-4 py-3">${u.display_name || '-'}</td>
                <td class="px-4 py-3">${u.gen_count || 0}</td>
                <td class="px-4 py-3 text-slate-400">${u.last_active ? u.last_active.slice(0, 16).replace('T', ' ') : '-'}</td>
            </tr>
        `).join('') || '<tr><td colspan="4" class="text-center py-8 text-slate-400">暂无数据</td></tr>';
    }
}

// ==================== 系统日志 ====================
async function loadLogs() {
    const action = document.getElementById('logActionFilter')?.value || '';
    const startDate = document.getElementById('logStartDate')?.value || '';
    const endDate = document.getElementById('logEndDate')?.value || '';
    const params = new URLSearchParams({ page: logPage, pageSize: 30 });
    if (action) params.set('action', action);
    if (startDate) params.set('startDate', startDate);
    if (endDate) params.set('endDate', endDate);

    const data = await api(`/api/admin/logs?${params}`);
    if (!data) return;

    const tbody = document.getElementById('logTableBody');
    if (data.list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-400">暂无日志</td></tr>';
    } else {
        tbody.innerHTML = data.list.map(l => `
            <tr class="border-t border-amber-50 hover:bg-amber-50/30">
                <td class="px-4 py-2 text-slate-500 whitespace-nowrap">${l.created_at?.slice(0, 16).replace('T', ' ') || '-'}</td>
                <td class="px-4 py-2"><span class="px-2 py-0.5 bg-amber-50 rounded text-xs tcm-primary">${l.action}</span></td>
                <td class="px-4 py-2 text-slate-600 max-w-md truncate">${l.detail || '-'}</td>
                <td class="px-4 py-2 text-slate-400">${l.ip || '-'}</td>
            </tr>
        `).join('');
    }
    document.getElementById('logPagination').textContent = `第 ${data.page} 页 / 共 ${data.total} 条`;
}

function prevLogPage() { if (logPage > 1) { logPage--; loadLogs(); } }
function nextLogPage() { logPage++; loadLogs(); }

// ==================== 系统设置 ====================
async function loadLLMConfig() {
    const data = await api('/api/llm/config');
    if (!data) return;
    document.getElementById('cfgProvider').value = data.provider || 'openai';
    document.getElementById('cfgEndpoint').value = data.endpoint || '';
    document.getElementById('cfgApiKey').value = data.apiKey || '';
    document.getElementById('cfgModel').value = data.model || '';
    document.getElementById('cfgEnabled').checked = data.enabled || false;
}

async function saveLLMConfig() {
    const body = {
        provider: document.getElementById('cfgProvider').value,
        endpoint: document.getElementById('cfgEndpoint').value,
        apiKey: document.getElementById('cfgApiKey').value,
        model: document.getElementById('cfgModel').value,
        enabled: document.getElementById('cfgEnabled').checked
    };
    const data = await api('/api/llm/config', { method: 'PUT', body: JSON.stringify(body) });
    const msg = document.getElementById('cfgMsg');
    if (data && data.success) {
        msg.textContent = '配置已保存';
        msg.className = 'text-sm text-green-600';
    } else {
        msg.textContent = data?.error || '保存失败';
        msg.className = 'text-sm text-red-500';
    }
    msg.classList.remove('hidden');
}

async function testLLMConfig() {
    const msg = document.getElementById('cfgMsg');
    msg.textContent = '测试中...';
    msg.className = 'text-sm text-amber-600';
    msg.classList.remove('hidden');
    const data = await api('/api/llm/test', { method: 'POST' });
    if (data && data.success) {
        msg.textContent = '连接成功: ' + data.message;
        msg.className = 'text-sm text-green-600';
    } else {
        msg.textContent = '连接失败: ' + (data?.message || '未知错误');
        msg.className = 'text-sm text-red-500';
    }
}

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await checkAuth();
    if (ok) loadOverview();
});
</script>
