<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>中药四性五味 - 药性分类游戏</title>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'SimSun', serif;
            background: linear-gradient(135deg, #F5F0E8 0%, #E8E0D5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        .game-header {
            background: linear-gradient(135deg, #6B4423 0%, #8B5A2B 100%);
            padding: 20px 30px;
            box-shadow: 0 4px 20px rgba(107, 68, 35, 0.3);
            position: relative;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-stats {
            display: flex;
            gap: 25px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .game-container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* 游戏模式选择 */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 15px 40px;
            border: 3px solid #8B5A2B;
            border-radius: 15px;
            background: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            font-weight: 600;
            font-family: inherit;
            color: #8B5A2B;
        }

        .mode-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(139, 90, 43, 0.3);
        }

        .mode-btn.active {
            background: #8B5A2B;
            color: #fff;
        }

        /* 游戏区域 */
        .game-area {
            display: none;
        }

        .game-area.active {
            display: block;
        }

        /* 分类桶 */
        .category-buckets {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .bucket {
            width: 160px;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            position: relative;
        }

        .bucket:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .bucket.hot {
            background: linear-gradient(135deg, #FEF2F2, #FEE2E2);
            border-color: #EF4444;
        }

        .bucket.warm {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border-color: #F59E0B;
        }

        .bucket.cold {
            background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
            border-color: #3B82F6;
        }

        .bucket.cool {
            background: linear-gradient(135deg, #E0E7FF, #C7D2FE);
            border-color: #6366F1;
        }

        .bucket.neutral {
            background: linear-gradient(135deg, #F3F4F6, #E5E7EB);
            border-color: #9CA3AF;
        }

        .bucket.drag-over {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .bucket-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .bucket-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .bucket-count {
            font-size: 13px;
            color: #999;
        }

        /* 中药卡片 */
        .herb-cards-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 200px;
            padding: 30px;
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            border: 2px dashed #D4C4B0;
        }

        .herb-card {
            width: 120px;
            padding: 20px 15px;
            background: #fff;
            border-radius: 14px;
            text-align: center;
            cursor: grab;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid #E8D4BE;
            user-select: none;
        }

        .herb-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.2);
            border-color: #8B5A2B;
        }

        .herb-card.dragging {
            opacity: 0.7;
            cursor: grabbing;
        }

        .herb-card.correct {
            background: #DCFCE7;
            border-color: #22C55E;
        }

        .herb-card.wrong {
            background: #FEE2E2;
            border-color: #EF4444;
            animation: shake 0.5s ease;
        }

        .herb-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .herb-name {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .herb-desc {
            font-size: 11px;
            color: #999;
            line-height: 1.3;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 五味桶 */
        .flavor-buckets {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .bucket.spicy {
            background: linear-gradient(135deg, #FEF2F2, #FECACA);
            border-color: #EF4444;
        }

        .bucket.sweet {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border-color: #F59E0B;
        }

        .bucket.sour {
            background: linear-gradient(135deg, #FEF3C7, #FEF08A);
            border-color: #EAB308;
        }

        .bucket.bitter {
            background: linear-gradient(135deg, #F3E8FF, #E9D5FF);
            border-color: #A855F7;
        }

        .bucket.salty {
            background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
            border-color: #3B82F6;
        }

        /* 底部按钮 */
        .game-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-reset {
            background: linear-gradient(135deg, #8B5A2B, #6B4423);
            color: #fff;
        }

        .btn-hint {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #fff;
        }

        .btn-back {
            background: linear-gradient(135deg, #6B7280, #4B5563);
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* 胜利弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #fff, #FFFBF7);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            animation: modalIn 0.5s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2D8C5A, #1F6B44);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 700;
            color: #8B5A2B;
            margin-bottom: 10px;
        }

        .modal-text {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(139, 90, 43, 0.1);
            border-radius: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2D8C5A, #1F6B44);
            color: #fff;
            padding: 14px 40px;
        }

        /* 游戏说明 */
        .game-instructions {
            text-align: center;
            padding: 20px;
            background: rgba(139, 90, 43, 0.1);
            border-radius: 15px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .game-instructions h3 {
            font-size: 18px;
            color: #8B5A2B;
            margin-bottom: 10px;
        }

        .game-instructions p {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
        }

        /* 触控优化 */
        .herb-card, .bucket, .mode-btn, .btn {
            -webkit-tap-highlight-color: transparent;
        }
        .herb-card:active, .bucket:active {
            transform: scale(0.97);
        }
        .btn {
            min-height: 44px;
        }
        .btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 768px) {
            .bucket {
                width: 120px;
                padding: 15px;
            }

            .bucket-icon {
                font-size: 28px;
            }

            .bucket-name {
                font-size: 15px;
            }

            .herb-card {
                width: 100px;
                padding: 15px 10px;
            }

            .game-header {
                padding: 15px 20px;
            }

            .game-title {
                font-size: 20px;
            }

            .game-stats {
                gap: 15px;
            }

            .stat-value {
                font-size: 18px;
            }

            .game-container {
                padding: 20px 15px;
            }

            .category-buckets {
                gap: 10px;
            }

            .herb-cards-area {
                padding: 20px 15px;
                gap: 10px;
            }

            .mode-selector {
                gap: 10px;
            }

            .mode-btn {
                padding: 12px 24px;
                font-size: 16px;
            }

            .game-footer {
                flex-wrap: wrap;
                gap: 10px;
                padding: 15px;
            }

            .game-footer .btn {
                flex: 1;
                justify-content: center;
                min-width: 0;
                padding: 12px 16px;
            }

            .modal-content {
                padding: 30px 20px;
                margin: 0 16px;
                max-width: calc(100vw - 32px);
            }

            .modal-stats {
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .game-title {
                font-size: 18px;
            }

            .stat-value {
                font-size: 16px;
            }

            .stat-label {
                font-size: 12px;
            }

            .stat-item {
                min-width: 50px;
            }

            .bucket {
                width: 70px;
                padding: 10px 8px;
            }

            .bucket-icon {
                font-size: 22px;
                margin-bottom: 6px;
            }

            .bucket-name {
                font-size: 13px;
            }

            .bucket-count {
                font-size: 11px;
            }

            .herb-card {
                width: 80px;
                padding: 10px 8px;
                min-height: 44px;
            }

            .herb-icon {
                font-size: 24px;
            }

            .herb-name {
                font-size: 13px;
            }

            .herb-desc {
                font-size: 10px;
            }

            .game-instructions {
                padding: 15px;
            }

            .game-instructions h3 {
                font-size: 16px;
            }

            .game-instructions p {
                font-size: 13px;
            }

            .modal-icon {
                width: 70px;
                height: 70px;
                font-size: 36px;
            }

            .modal-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <a href="tcm-game-hub.html" style="position:absolute;top:10px;left:12px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;text-decoration:none;color:#666;font-size:18px;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,0.1);">←</a>
        <div class="header-content">
            <h1 class="game-title">
                <span>🌿</span>
                中药四性五味
            </h1>
            <div class="game-stats">
                <div class="stat-item">
                    <div class="stat-label">已分类</div>
                    <div class="stat-value"><span id="sorted">0</span>/10</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">正确率</div>
                    <div class="stat-value" id="accuracy">100%</div>
                </div>
            </div>
        </div>
    </header>

    <main class="game-container">
        <div class="game-instructions">
            <h3>📖 游戏说明</h3>
            <p>拖动中药卡片到对应的分类桶中，学习中药的四性和五味知识！</p>
        </div>

        <!-- 模式选择 -->
        <div class="mode-selector" id="modeSelector">
            <button class="mode-btn active" onclick="switchMode('nature')">
                🔥 四性分类
            </button>
            <button class="mode-btn" onclick="switchMode('flavor')">
                🍯 五味分类
            </button>
        </div>

        <!-- 四性游戏区 -->
        <div class="game-area active" id="natureGame">
            <div class="category-buckets">
                <div class="bucket hot" data-category="hot" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('hot')">
                    <div class="bucket-icon">🔥</div>
                    <div class="bucket-name">热</div>
                    <div class="bucket-count">0</div>
                </div>
                <div class="bucket warm" data-category="warm" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('warm')">
                    <div class="bucket-icon">🌤️</div>
                    <div class="bucket-name">温</div>
                    <div class="bucket-count">0</div>
                </div>
                <div class="bucket cold" data-category="cold" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('cold')">
                    <div class="bucket-icon">❄️</div>
                    <div class="bucket-name">寒</div>
                    <div class="bucket-count">0</div>
                </div>
                <div class="bucket cool" data-category="cool" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('cool')">
                    <div class="bucket-icon">🌬️</div>
                    <div class="bucket-name">凉</div>
                    <div class="bucket-count">0</div>
                </div>
            </div>

            <div class="herb-cards-area" id="natureCards"></div>
        </div>

        <!-- 五味游戏区 -->
        <div class="game-area" id="flavorGame">
            <div class="category-buckets flavor-buckets">
                <div class="bucket spicy" data-category="spicy" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('spicy')">
                    <div class="bucket-icon">🌶️</div>
                    <div class="bucket-name">辛</div>
                    <div class="bucket-count">0</div>
                </div>
                <div class="bucket sweet" data-category="sweet" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('sweet')">
                    <div class="bucket-icon">🍯</div>
                    <div class="bucket-name">甘</div>
                    <div class="bucket-count">0</div>
                </div>
                <div class="bucket sour" data-category="sour" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('sour')">
                    <div class="bucket-icon">🍋</div>
                    <div class="bucket-name">酸</div>
                    <div class="bucket-count">0</div>
                </div>
                <div class="bucket bitter" data-category="bitter" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('bitter')">
                    <div class="bucket-icon">🍵</div>
                    <div class="bucket-name">苦</div>
                    <div class="bucket-count">0</div>
                </div>
                <div class="bucket salty" data-category="salty" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="selectBucket('salty')">
                    <div class="bucket-icon">🧂</div>
                    <div class="bucket-name">咸</div>
                    <div class="bucket-count">0</div>
                </div>
            </div>

            <div class="herb-cards-area" id="flavorCards"></div>
        </div>
    </main>

    <footer class="game-footer">
        <button class="btn btn-reset" onclick="resetGame()">
            <span>↻</span>
            重置
        </button>
        <button class="btn btn-hint" onclick="showHint()">
            <span>💡</span>
            提示
        </button>
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span>
            返回
        </button>
    </footer>

    <div class="modal-overlay" id="victoryModal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">恭喜通关！</h2>
            <p class="modal-text">你已经掌握了中药的四性五味知识！</p>
            <div class="modal-stats">
                <div>
                    <div class="stat-label">正确率</div>
                    <div class="stat-value" id="finalAccuracy">100%</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="resetGame()">
                再玩一次
            </button>
            <a href="tcm-game-hub.html" class="btn btn-back" style="margin-top:12px;display:inline-flex;text-decoration:none;">返回游戏大厅</a>
        </div>
    </div>

    <script>
        // 四性中药数据
        const natureHerbs = [
            { id: 1, name: '附子', icon: '🫒', nature: 'hot', desc: '回阳救逆' },
            { id: 2, name: '干姜', icon: '🫚', nature: 'hot', desc: '温中散寒' },
            { id: 3, name: '肉桂', icon: '🪵', nature: 'hot', desc: '补火助阳' },
            { id: 4, name: '黄芪', icon: '🌿', nature: 'warm', desc: '补气升阳' },
            { id: 5, name: '当归', icon: '🌱', nature: 'warm', desc: '补血调经' },
            { id: 6, name: '陈皮', icon: '🍊', nature: 'warm', desc: '理气健脾' },
            { id: 7, name: '金银花', icon: '🌼', nature: 'cold', desc: '清热解毒' },
            { id: 8, name: '连翘', icon: '🌿', nature: 'cold', desc: '清热解毒' },
            { id: 9, name: '菊花', icon: '🌸', nature: 'cool', desc: '疏散风热' },
            { id: 10, name: '薄荷', icon: '🍃', nature: 'cool', desc: '疏散风热' }
        ];

        // 五味中药数据
        const flavorHerbs = [
            { id: 1, name: '麻黄', icon: '🌾', flavor: 'spicy', desc: '发汗解表' },
            { id: 2, name: '桂枝', icon: '🪵', flavor: 'spicy', desc: '发汗解肌' },
            { id: 3, name: '人参', icon: '🌿', flavor: 'sweet', desc: '大补元气' },
            { id: 4, name: '甘草', icon: '🌱', flavor: 'sweet', desc: '补脾益气' },
            { id: 5, name: '山楂', icon: '🍒', flavor: 'sour', desc: '消食化积' },
            { id: 6, name: '乌梅', icon: '🫐', flavor: 'sour', desc: '敛肺止咳' },
            { id: 7, name: '黄连', icon: '🌿', flavor: 'bitter', desc: '清热燥湿' },
            { id: 8, name: '黄芩', icon: '🌱', flavor: 'bitter', desc: '清热燥湿' },
            { id: 9, name: '海藻', icon: '🌿', flavor: 'salty', desc: '消痰软坚' },
            { id: 10, name: '昆布', icon: '🌿', flavor: 'salty', desc: '消痰软坚' }
        ];

        let gameState = {
            mode: 'nature',
            selectedCard: null,
            sortedCount: 0,
            correctCount: 0,
            totalCount: 10,
            bucketCounts: {}
        };

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initGame() {
            gameState = {
                mode: 'nature',
                selectedCard: null,
                sortedCount: 0,
                correctCount: 0,
                totalCount: 10,
                bucketCounts: {}
            };

            document.getElementById('sorted').textContent = '0';
            document.getElementById('accuracy').textContent = '100%';
            document.getElementById('victoryModal').classList.remove('show');

            renderHerbs();
            updateBucketCounts();
        }

        function switchMode(mode) {
            gameState.mode = mode;

            // 更新模式按钮
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 更新游戏区域
            document.querySelectorAll('.game-area').forEach(area => area.classList.remove('active'));
            document.getElementById(mode + 'Game').classList.add('active');

            initGame();
        }

        function renderHerbs() {
            const container = document.getElementById(gameState.mode + 'Cards');
            container.innerHTML = '';

            const herbs = gameState.mode === 'nature' ? natureHerbs : flavorHerbs;
            const shuffled = shuffleArray([...herbs]);

            shuffled.forEach(herb => {
                const card = document.createElement('div');
                card.className = 'herb-card';
                card.draggable = true;
                card.dataset.id = herb.id;
                card.dataset.category = gameState.mode === 'nature' ? herb.nature : herb.flavor;
                card.innerHTML = `
                    <div class="herb-icon">${herb.icon}</div>
                    <div class="herb-name">${herb.name}</div>
                    <div class="herb-desc">${herb.desc}</div>
                `;

                card.addEventListener('dragstart', dragStart);
                card.addEventListener('dragend', dragEnd);
                card.addEventListener('click', () => selectCard(card));

                container.appendChild(card);
            });
        }

        function selectCard(card) {
            if (card.classList.contains('correct')) return;

            // 清除之前的选择
            document.querySelectorAll('.herb-card').forEach(c => c.style.outline = 'none');

            if (gameState.selectedCard === card) {
                gameState.selectedCard = null;
            } else {
                gameState.selectedCard = card;
                card.style.outline = '3px solid #8B5A2B';
            }
        }

        function selectBucket(category) {
            if (!gameState.selectedCard) return;

            const card = gameState.selectedCard;
            const cardCategory = card.dataset.category;

            if (cardCategory === category) {
                // 正确
                card.classList.add('correct');
                card.draggable = false;
                gameState.correctCount++;
                gameState.sortedCount++;
                gameState.bucketCounts[category] = (gameState.bucketCounts[category] || 0) + 1;

                updateBucketCounts();

                setTimeout(() => {
                    card.style.display = 'none';
                    checkVictory();
                }, 500);
            } else {
                // 错误
                card.classList.add('wrong');
                setTimeout(() => {
                    card.classList.remove('wrong');
                }, 500);
            }

            gameState.selectedCard = null;
            card.style.outline = 'none';

            updateStats();
        }

        function dragStart(e) {
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', e.target.dataset.id);
            gameState.selectedCard = e.target;
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function allowDrop(e) {
            e.preventDefault();
            const bucket = e.target.closest('.bucket');
            if (bucket) {
                bucket.classList.add('drag-over');
            }
        }

        function drop(e) {
            e.preventDefault();
            const bucket = e.target.closest('.bucket');
            if (bucket) {
                bucket.classList.remove('drag-over');
                const category = bucket.dataset.category;
                selectBucket(category);
            }
        }

        function updateBucketCounts() {
            const buckets = document.querySelectorAll('.bucket');
            buckets.forEach(bucket => {
                const category = bucket.dataset.category;
                const count = bucket.querySelector('.bucket-count');
                if (gameState.bucketCounts[category]) {
                    count.textContent = gameState.bucketCounts[category];
                } else {
                    count.textContent = '0';
                }
            });
        }

        function updateStats() {
            document.getElementById('sorted').textContent = gameState.sortedCount;
            const accuracy = Math.round((gameState.correctCount / gameState.totalCount) * 100);
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function checkVictory() {
            if (gameState.sortedCount >= gameState.totalCount) {
                const accuracy = Math.round((gameState.correctCount / gameState.totalCount) * 100);
                document.getElementById('finalAccuracy').textContent = accuracy + '%';
                setTimeout(() => {
                    document.getElementById('victoryModal').classList.add('show');
                    // 提交分数
                    submitScore(gameState.correctCount * 10, accuracy, 0);
                }, 300);
            }
        }

        async function submitScore(score, accuracy, duration) {
            try {
                const token = localStorage.getItem('token') || '';
                await fetch('/api/games/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ gameType: 'herb', score, accuracy, durationSeconds: duration })
                });
            } catch {}
        }

        function resetGame() {
            initGame();
        }

        function showHint() {
            const cards = document.querySelectorAll('.herb-card:not(.correct)');
            if (cards.length > 0) {
                const card = cards[0];
                const category = card.dataset.category;
                const bucket = document.querySelector(`.bucket[data-category="${category}"]`);
                const bucketName = bucket.querySelector('.bucket-name').textContent;

                card.style.outline = '3px solid #F59E0B';
                bucket.style.transform = 'scale(1.1)';

                setTimeout(() => {
                    card.style.outline = 'none';
                    bucket.style.transform = '';
                }, 1500);
            }
        }

        function goBack() {
            if (confirm('确定要退出当前游戏吗？')) {
                window.history.back();
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', initGame);

        // 防止拖拽时bucket的drag-over样式残留
        document.addEventListener('dragleave', (e) => {
            if (e.target.classList.contains('bucket')) {
                e.target.classList.remove('drag-over');
            }
        });
    </script>
</body>
</html>
