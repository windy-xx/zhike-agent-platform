<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script>
        // PptxGenJS 多CDN加载保障
        function loadPptxGenJS() {
            return new Promise(function(resolve) {
                if (typeof PptxGenJS !== 'undefined') { resolve(true); return; }
                var cdns = [
                    'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
                    'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
                    'https://cdn.bootcdn.net/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.min.js'
                ];
                var i = 0;
                function tryNext() {
                    if (i >= cdns.length) { resolve(false); return; }
                    var s = document.createElement('script');
                    s.src = cdns[i];
                    s.onload = function() { resolve(typeof PptxGenJS !== 'undefined'); };
                    s.onerror = function() { i++; tryNext(); };
                    document.head.appendChild(s);
                }
                tryNext();
            });
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #F9F6F0 0%, #F5F0E8 100%);
            min-height: 100vh;
            color: #333;
        }

        .tcm-primary { color: #8B5A2B; }
        .tcm-accent { color: #C23B22; }
        .tcm-green { color: #2D8C5A; }
        .bg-tcm-primary { background-color: #8B5A2B; }
        .bg-tcm-accent { background-color: #C23B22; }
        .bg-tcm-green { background-color: #2D8C5A; }

        /* 幻灯片缩略图 */
        .slide-thumb {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .slide-thumb:hover {
            transform: translateY(-2px);
            border-color: #E5DCC8;
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.15);
        }

        .slide-thumb.active {
            border-color: #8B5A2B;
            box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.15);
        }

        /* 缩略图包装器 */
        .thumbnail-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
        }

        /* 缩略图内容 - 与主预览统一，通过缩放实现 */
        .thumbnail-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            transform-origin: top left;
            transform: scale(var(--thumb-scale, 0.1875));
            pointer-events: none;
        }

        /* 主预览容器 - 自适应缩放 */
        .slide-preview-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .slide-preview-wrapper .slide-render {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            transform-origin: top left;
        }

        /* 工具栏按钮 */
        .toolbar-btn {
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background-color: #FEF3C7;
            color: #8B5A2B;
            transform: translateY(-1px);
        }

        /* 幻灯片容器 */
        .slide-container {
            position: relative;
            overflow: hidden;
        }

        .slide-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .slide-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 五行圆形图标 */
        .wuxing-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .wuxing-circle::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: 0.3;
        }

        .wood { background: linear-gradient(135deg, #84CC16 0%, #65A30D 100%); }
        .fire { background: linear-gradient(135deg, #F87171 0%, #DC2626 100%); }
        .earth { background: linear-gradient(135deg, #FBBF24 0%, #D97706 100%); }
        .metal { background: linear-gradient(135deg, #9CA3AF 0%, #6B7280 100%); }
        .water { background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%); }

        /* 相生相克箭头 */
        .arrow-sheng {
            color: #22C55E;
            font-size: 24px;
        }

        .arrow-ke {
            color: #EF4444;
            font-size: 24px;
        }

        /* 内容卡片 */
        .content-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* 脏腑图标 */
        .organ-icon {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            background: white;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        /* 中药展示卡片 */
        .herb-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .herb-card:hover {
            transform: translateY(-4px);
            border-color: #8B5A2B;
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.2);
        }

        /* 书法字体 */
        .shufa {
            font-family: 'Ma Shan Zheng', 'KaiTi', cursive;
        }

        /* 脉搏动画 */
        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 云纹装饰 */
        .cloud-pattern {
            position: absolute;
            font-size: 40px;
            opacity: 0.1;
            color: #8B5A2B;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 模板选择卡片 */
        .template-card {
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .template-card.selected {
            border-color: #8B5A2B;
            box-shadow: 0 0 0 4px rgba(139, 90, 43, 0.2);
        }

        /* AI加载动画 */
        .ai-loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(139, 90, 43, 0.3);
            border-top-color: #8B5A2B;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 16px 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid #22C55E;
        }

        .toast.info {
            border-left: 4px solid #3B82F6;
        }

        /* 图片装饰 */
        .decoration-image {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>

    <!-- AI快捷工具栏 -->

        <button class="flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-lg text-sm text-slate-600 hover:text-tcm-primary hover:border-tcm-primary border border-amber-200 transition-all" onclick="addDecoration()">

        <button class="flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-lg text-sm text-slate-600 hover:text-tcm-primary hover:border-tcm-primary border border-amber-200 transition-all" onclick="generateSummary()">

        <button class="flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-lg text-sm text-slate-600 hover:text-tcm-primary hover:border-tcm-primary border border-amber-200 transition-all" onclick="addClassicQuote()">

    <!-- 主编辑区 -->
    <main class="flex-1 flex overflow-hidden">
        <!-- 左侧幻灯片列表 -->
        <section class="hidden md:flex w-72 bg-white border-r border-amber-100 flex-col flex-shrink-0">
            <div class="p-4 border-b border-amber-100">

                    新建幻灯片

            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="slideList">

        <!-- 中间编辑区 -->

            <div class="flex-1 flex items-center justify-center">

            </div>

            <!-- 编辑工具栏 -->

                <div class="flex items-center justify-between min-w-[500px] md:min-w-0">
                    <div class="flex items-center gap-6">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-slate-400">页面</span>
                            <span class="text-sm font-medium tcm-primary" id="currentPage">1 / 6</span>

                        <div class="flex gap-2">

                            </button>
                            <button class="p-2 hover:bg-amber-50 rounded-lg text-slate-500 hover:text-tcm-primary" onclick="formatText('italic')">
                                <iconify-icon icon="solar:text-italic-bold"></iconify-icon>
                            </button>
                            <button class="p-2 hover:bg-amber-50 rounded-lg text-slate-500 hover:text-tcm-primary" onclick="formatText('underline')">
                                <iconify-icon icon="solar:text-underline-bold"></iconify-icon>
                            </button>
                        </div>
                        <div class="h-6 w-px bg-amber-200"></div>
                        <div class="flex gap-2">
                            <button class="p-2 hover:bg-amber-50 rounded-lg text-slate-500 hover:text-tcm-primary" onclick="formatText('left')">
                                <iconify-icon icon="solar:align-left-bold"></iconify-icon>

                            <button class="p-2 hover:bg-amber-50 rounded-lg text-slate-500 hover:text-tcm-primary" onclick="formatText('center')">
                                <iconify-icon icon="solar:align-center-horizontal-bold"></iconify-icon>

        <!-- 右侧属性面板 -->

            <div class="p-4 border-b border-amber-100">
                <h3 class="font-bold text-sm">页面属性</h3>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <!-- 当前选中元素 -->
                <div>
                    <p class="text-xs font-bold text-slate-500 mb-3">当前选中：<span id="selectedElement">标题</span></p>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs text-slate-500 mb-1 block">标题内容</label>

                        <div>
                            <label class="text-xs text-slate-500 mb-1 block">副标题</label>
                            <input class="w-full border border-amber-200 rounded-lg px-3 py-2 text-sm focus:border-tcm-primary focus:outline-none" id="subtitleText" value="" oninput="updateSlideSubtitle()"/>

                        <div>
                            <label class="text-xs text-slate-500 mb-1 block">背景样式</label>

                                <option value="blue">蓝色系背景</option>

                            </select>
                        </div>
                    </div>

                thumb.className = `slide-thumb bg-white rounded-lg p-2 shadow-sm ${index === currentSlideIndex ? 'active' : ''}`;

        function renderCurrentSlide() {
            const container = document.getElementById('slideContainer');
            const slide = slides[currentSlideIndex];
            const bg = getGradientColors(slide.gradient);

            // 绝对定位铺满父容器
            const parentDiv = container.parentElement;
            parentDiv.style.position = 'relative';
            container.style.cssText = 'position:absolute;inset:0;max-width:none;border-radius:16px;';
            container.className = 'shadow-2xl overflow-hidden border border-amber-100 slide-container';

            container.innerHTML = '<div class="slide-preview-wrapper"></div>';
            const wrapper = container.querySelector('.slide-preview-wrapper');
            wrapper.style.background = 'linear-gradient(to bottom right,'+bg+')';

            // 创建固定1280x720的内容div
            const slideRender = document.createElement('div');
            slideRender.className = 'slide-render';
            slideRender.innerHTML = generateSlideHTML(slide);

            // 应用 _style 样式覆盖到渲染后的DOM
            applySlideStyleOverrides(slideRender, slide);

            wrapper.appendChild(slideRender);

            // 动态计算缩放比例，铺满容器
            function updateMainScale() {
                const rect = wrapper.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const scale = Math.min(rect.width / 1280, rect.height / 720);
                slideRender.style.transform = 'scale('+scale+')';
                slideRender.style.left = ((rect.width - 1280 * scale) / 2) + 'px';
                slideRender.style.top = ((rect.height - 720 * scale) / 2) + 'px';
            }

            // 延迟计算确保布局已完成
            requestAnimationFrame(updateMainScale);
            window._pptResizeHandler && window.removeEventListener('resize', window._pptResizeHandler);
            window._pptResizeHandler = updateMainScale;
            window.addEventListener('resize', updateMainScale);

            // 更新右侧面板
            document.getElementById('textContent').value = slide.title;
            document.getElementById('subtitleText').value = slide.subtitle;
            document.getElementById('bgStyle').value = slide.template;

            // 同步样式控件状态
            if (slide._style) {
                if (slide._style.fontFamily) {
                    var ff = document.getElementById('fontFamily');
                    if (ff) ff.value = slide._style.fontFamily;
                }
                if (slide._style.fontSize) {
                    var fs = document.getElementById('fontSize');
                    if (fs) fs.value = slide._style.fontSize;
                }
                if (slide._style.color) {
                    var fc = document.getElementById('fontColor');
                    if (fc) fc.value = slide._style.color;
                }
            }

            // 触发同步到工作台
            syncToWorkspace();
        }

        // 将 _style 覆盖应用到已渲染的幻灯片DOM
        function applySlideStyleOverrides(slideRender, slide) {
            if (!slide._style) return;
            var st = slide._style;

            // 标题元素
            var titleEl = slideRender.querySelector('#slideTitle') || slideRender.querySelector('[id="slideTitle"]');
            if (titleEl) {
                if (st.fontFamily) titleEl.style.fontFamily = st.fontFamily + ', Ma Shan Zheng, cursive';
                if (st.fontSize) titleEl.style.fontSize = st.fontSize;
                if (st.bold !== undefined) titleEl.style.fontWeight = st.bold ? 'bold' : 'normal';
                if (st.italic !== undefined) titleEl.style.fontStyle = st.italic ? 'italic' : 'normal';
                if (st.underline !== undefined) titleEl.style.textDecoration = st.underline ? 'underline' : 'none';
                if (st.color) titleEl.style.color = st.color;
                if (st.align) titleEl.style.textAlign = st.align;
            }

            // 副标题元素
            var subEl = slideRender.querySelector('#slideSubtitle') || slideRender.querySelector('[id="slideSubtitle"]');
            if (subEl) {
                if (st.fontFamily) subEl.style.fontFamily = st.fontFamily + ', serif';
                if (st.color) subEl.style.color = st.color;
            }

            // 深色背景模式下调整文字颜色对比度
            if (slide.gradient && slide.gradient.includes('slate-8')) {
                var allText = slideRender.querySelectorAll('p, span, li, h3, h4');
                allText.forEach(function(el) {
                    var cs = window.getComputedStyle(el);
                    // 如果文字颜色偏暗，改为浅色
                    if (cs.color) {
                        var rgb = cs.color.match(/\d+/g);
                        if (rgb && rgb.length >= 3) {
                            var brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
                            if (brightness < 80) {
                                el.style.color = 'rgba(255,255,255,0.9)';
                            }
                        }
                    }
                });
                // 调整卡片背景为半透明暗色
                var cards = slideRender.querySelectorAll('div');
                cards.forEach(function(el) {
                    var bg = el.style.background;
                    if (bg && bg.includes('rgba(255,255,255')) {
                        el.style.background = bg.replace('rgba(255,255,255,0.88)', 'rgba(30,41,59,0.85)')
                                                 .replace('rgba(255,255,255,0.85)', 'rgba(30,41,59,0.85)')
                                                 .replace('rgba(255,255,255,0.7)', 'rgba(30,41,59,0.7)');
                    }
                });
            }
        }

        var _syncTimer = null;

        // 将当前编辑的幻灯片数据同步回工作台（防抖）
        function syncToWorkspace() {
            if (_syncTimer) clearTimeout(_syncTimer);
            _syncTimer = setTimeout(function() {
                try {
                    var syncData = {
                        source: 'ppt-editor',
                        timestamp: Date.now(),
                        slideCount: slides.length,
                        title: (slides[0] && slides[0].title) || 'PPT课件',
                        slides: slides.map(function(s) {
                            return {
                                slideType: s.slideType || null,
                                id: s.id,
                                title: s.title,
                                subtitle: s.subtitle,
                                icon: s.icon,
                                gradient: s.gradient,
                                template: s.template,
                                decorations: s.decorations || [],
                                classicQuote: s.classicQuote || null,
                                _style: s._style || null,
                                content: s.content || null
                            };
                        })
                    };
                    localStorage.setItem('tcm_ppt_sync_back', JSON.stringify(syncData));

                    // 后端持久化保存（带认证）
                    var token = localStorage.getItem('token') || '';
                    var headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = 'Bearer ' + token;
                    fetch('/api/projects/default/slides', {
                        method: 'PUT',
                        headers: headers,
                        body: JSON.stringify({ slides: syncData.slides })
                    }).catch(function() {});

                    // WebSocket 广播
                    if (window._pptWs && window._pptWs.readyState === 1) {
                        window._pptWs.send(JSON.stringify({
                            type: 'slide_update',
                            projectId: 'default',
                            slides: syncData.slides
                        }));
                    }
                } catch(e) {
                    console.warn('同步到工作台失败:', e);
                }
            }, 500);
        }

        function executeAiPrompt() {
            const prompt = document.getElementById('aiPrompt').value.trim();
            if (!prompt) {
                showToast('请输入修改指令', 'info');
                return;
            }
            showToast('AI正在处理...', 'info');
            saveToHistory();

            setTimeout(() => {
                const slide = slides[currentSlideIndex];
                const lowerPrompt = prompt.toLowerCase();

                // 标题修改
                if (lowerPrompt.includes('标题') && (lowerPrompt.includes('改') || lowerPrompt.includes('换') || lowerPrompt.includes('修改'))) {
                    const match = prompt.match(/改成?["\u201C\u201D]?(.+?)["\u201C\u201D]?$/);
                    if (match) {
                        slide.title = match[1].replace(/["\u201C\u201D]/g, '');
                    }
                }
                // 副标题修改
                else if (lowerPrompt.includes('副标题')) {
                    const match = prompt.match(/改成?["\u201C\u201D]?(.+?)["\u201C\u201D]?$/);
                    if (match) {
                        slide.subtitle = match[1].replace(/["\u201C\u201D]/g, '');
                    }
                }
                // 添加经典引文
                else if (lowerPrompt.includes('引文') || lowerPrompt.includes('经典') || lowerPrompt.includes('黄帝内经')) {
                    const quote = classicQuotes[Math.floor(Math.random() * classicQuotes.length)];
                    slide.classicQuote = { source: quote.source, content: quote.content };
                }
                // 添加装饰
                else if (lowerPrompt.includes('配图') || lowerPrompt.includes('装饰') || lowerPrompt.includes('图片')) {
                    const deco = decorations[Math.floor(Math.random() * decorations.length)];
                    slide.decorations.push({
                        emoji: deco.emoji,
                        top: (10 + Math.random() * 60) + '%',
                        left: (5 + Math.random() * 80) + '%',
                        size: deco.size
                    });
                }
                // 字体相关
                else if (lowerPrompt.includes('书法') || lowerPrompt.includes('字体')) {
                    if (!slide._style) slide._style = {};
                    if (lowerPrompt.includes('书法')) slide._style.fontFamily = 'Ma Shan Zheng';
                    else if (lowerPrompt.includes('宋体')) slide._style.fontFamily = 'SimSun';
                    else if (lowerPrompt.includes('楷体')) slide._style.fontFamily = 'KaiTi';
                }
                // 字号相关
                else if (lowerPrompt.includes('大') || lowerPrompt.includes('小')) {
                    if (!slide._style) slide._style = {};
                    if (lowerPrompt.includes('大')) slide._style.fontSize = '28px';
                    else if (lowerPrompt.includes('小')) slide._style.fontSize = '16px';
                }
                // 换背景/模板
                else if (lowerPrompt.includes('背景') || lowerPrompt.includes('模板')) {
                    const gradMap = {
                        '经典': 'from-amber-50 via-white to-emerald-50',
                        '现代': 'from-slate-50 via-gray-50 to-zinc-50',
                        '自然': 'from-green-50 via-emerald-50 to-teal-50',
                        '水墨': 'from-slate-100 via-gray-50 to-slate-200',
                        '活力': 'from-rose-50 via-amber-50 to-sky-50'
                    };
                    for (const [key, val] of Object.entries(gradMap)) {
                        if (lowerPrompt.includes(key)) { slide.gradient = val; break; }
                    }
                }
                // 删除引文
                else if (lowerPrompt.includes('删除') && (lowerPrompt.includes('引文') || lowerPrompt.includes('经典'))) {
                    slide.classicQuote = null;
                }
                // 删除装饰
                else if (lowerPrompt.includes('删除') && (lowerPrompt.includes('配图') || lowerPrompt.includes('装饰'))) {
                    slide.decorations = [];
                }
                // 添加幻灯片
                else if (lowerPrompt.includes('添加') && lowerPrompt.includes('幻灯片')) {
                    addNewSlide();
                    showToast('已添加新幻灯片', 'success');
                    document.getElementById('aiPrompt').value = '';
                    return;
                }

                renderCurrentSlide();
                renderThumbnails();
                document.getElementById('aiPrompt').value = '';
                showToast('修改完成：' + prompt, 'success');
            }, 800);
        }

        // ==================== 撤销/重做 ====================

        function saveToHistory() {
            // 删除当前位置之后的历史
            history = history.slice(0, historyIndex + 1);
            // 保存当前状态
            history.push(JSON.stringify(slides));
            // 限制历史记录数量
            if (history.length > maxHistory) {
                history.shift();
            } else {
                historyIndex++;
            }
            updateHistoryButtons();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                slides = JSON.parse(history[historyIndex]);
                selectSlide(currentSlideIndex);
                showToast('已撤销');
            } else {
                showToast('没有可撤销的操作', 'info');
            }
            updateHistoryButtons();
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                slides = JSON.parse(history[historyIndex]);
                selectSlide(currentSlideIndex);
                showToast('已重做');
            } else {
                showToast('没有可重做的操作', 'info');
            }
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            document.getElementById('undoBtn').style.opacity = historyIndex > 0 ? '1' : '0.5';
            document.getElementById('redoBtn').style.opacity = historyIndex < history.length - 1 ? '1' : '0.5';
        }

        // 去掉颜色值的#前缀（PptxGenJS需要）
        function c(color) { return (color || '').replace('#', ''); }

        // 获取背景色（用于PptxGenJS）
        function getSlideBgColor(slide) {
            const bgMap = {
                'from-amber-50 via-white to-emerald-50': 'FDF8F0',
                'from-lime-50 via-green-50 to-emerald-50': 'F0FDF4',
                'from-rose-50 via-red-50 to-orange-50': 'FFF5F5',
                'from-amber-50 via-yellow-50 to-orange-50': 'FFFBEB',
                'from-slate-50 via-gray-50 to-zinc-50': 'F8FAFC',
                'from-sky-50 via-blue-50 to-cyan-50': 'EFF6FF',
                'from-amber-50 via-amber-50 to-amber-50': 'FFFBEB',
                'from-slate-100 via-amber-50 to-emerald-50': 'F1F5F9',
                'from-slate-800 via-slate-700 to-slate-900': '1E293B',
                'from-blue-50 via-indigo-50 to-cyan-50': 'EFF6FF',
                'from-green-50 via-emerald-50 to-teal-50': 'F0FDF4',
                'from-rose-50 via-pink-50 to-fuchsia-50': 'FFF1F2'
            };
            return bgMap[slide.gradient] || 'FDF8F0';
        }

        // 获取 _style 中的字体设置（用于导出）
        function getExportFont(slide) {
            var st = slide._style || {};
            return {
                fontFace: st.fontFamily || 'Microsoft YaHei',
                color: st.color ? c(st.color) : '6B4226',
                bold: st.bold !== undefined ? st.bold : true
            };
        }

        function exportPPT() {
            if (typeof PptxGenJS === 'undefined') {
                showToast('正在加载导出库，请稍候...', 'info');
                loadPptxGenJS().then(function(ok) {
                    if (ok) { exportPPT(); }
                    else { showToast('导出库加载失败，请检查网络后刷新页面', 'error'); }
                });

                ['表里关系', wd.fuRelation]
            ];
            fuInfo.forEach(function(info, ri) {
                var ry = cardY + 0.9 + ri * 0.25;
                slide.addText(info[0], {
                    x: fuX + 0.15, y: ry, w: 1.3, h: 0.25,
                    fontSize: 13, color: '7C6A54', fontFace: '微软雅黑'
                });
                slide.addText(info[1], {
                    x: fuX + 1.5, y: ry, w: 2.4, h: 0.25,
                    fontSize: 13, bold: true, color: tc, fontFace: '微软雅黑'
                });
            });

            // === 五行对应表 ===
            var corrY = cardY + organCardH + 0.15;
            slide.addShape(pptx.ShapeType.roundRect, {
                x: leftX, y: corrY, w: organCardW * 2 + 0.15, h: 1.5,
                fill: { color: 'FFFFFF', transparency: 12 },
                shadow: { type: 'outer', blur: 6, offset: 2, color: '000000', opacity: 0.05 },
                rectRadius: 0.12
            });
            slide.addText('五行对应', {
                x: leftX + 0.15, y: corrY + 0.08, w: 3, h: 0.35,
                fontSize: 15, bold: true, color: tc, fontFace: '微软雅黑'
            });

            // 对应关系 4列布局
            var corrCols = 4;
            var corrCellW = (organCardW * 2 + 0.15 - 0.3) / corrCols;
            wd.corr.forEach(function(c, ci) {
                var col = ci % corrCols;
                var row = Math.floor(ci / corrCols);
                var cx = leftX + 0.15 + col * corrCellW;
                var cy = corrY + 0.5 + row * 0.45;
                slide.addText(c[0], {
                    x: cx, y: cy, w: corrCellW * 0.45, h: 0.4,
                    fontSize: 12, color: '7C6A54', fontFace: '微软雅黑'
                });
                slide.addText(c[1], {
                    x: cx + corrCellW * 0.45, y: cy, w: corrCellW * 0.5, h: 0.4,
                    fontSize: 12, bold: true, color: '4A3728', fontFace: '微软雅黑'
                });
            });

            // === 相生相克关系 ===
            var relY = corrY + 1.65;
            slide.addShape(pptx.ShapeType.roundRect, {
                x: leftX, y: relY, w: organCardW * 2 + 0.15, h: 1.0,
                fill: { color: 'FFFFFF', transparency: 12 },
                shadow: { type: 'outer', blur: 6, offset: 2, color: '000000', opacity: 0.05 },
                rectRadius: 0.12
            });
            slide.addText('相生相克关系', {
                x: leftX + 0.15, y: relY + 0.08, w: 3, h: 0.3,
                fontSize: 15, bold: true, color: tc, fontFace: '微软雅黑'
            });

            var relItems = [
                { label: '→ ' + wd.sheng, color: '22C55E' },
                { label: '← ' + wd.beSheng, color: '38BDF8' },
                { label: '✕ ' + wd.ke, color: 'EF4444' },
                { label: '⚠ ' + wd.beKe, color: 'FBBF24' }
            ];
            relItems.forEach(function(ri, ii) {
                var col = ii % 2;
                var row = Math.floor(ii / 2);
                var rx = leftX + 0.15 + col * (organCardW + 0.05);
                var ry = relY + 0.45 + row * 0.3;
                slide.addText(ri.label, {
                    x: rx, y: ry, w: organCardW - 0.1, h: 0.28,
                    fontSize: 13, color: '4A3728', fontFace: '微软雅黑'
                });
            });

            // === 经典引文 ===
            var pageQuote = sd.classicQuote || wd.defaultQuote;
            if (pageQuote) {
                var quoteY = relY + 1.15;
                slide.addShape(pptx.ShapeType.roundRect, {
                    x: leftX, y: quoteY, w: organCardW * 2 + 0.15, h: 1.0,
                    fill: { color: 'FFFFFF', transparency: 12 },
                    shadow: { type: 'outer', blur: 6, offset: 2, color: '000000', opacity: 0.05 },
                    rectRadius: 0.12
                });
                // 左边框
                slide.addShape(pptx.ShapeType.rect, {
                    x: leftX + 0.04, y: quoteY + 0.08, w: 0.06, h: 0.84,
                    fill: { color: '8B5A2B' }
                });
                slide.addText(pageQuote.source, {
                    x: leftX + 0.2, y: quoteY + 0.1, w: 8, h: 0.3,
                    fontSize: 12, bold: true, color: '8B5A2B', fontFace: '微软雅黑'
                });
                slide.addText('\u201C' + pageQuote.content + '\u201D', {
                    x: leftX + 0.2, y: quoteY + 0.42, w: 8, h: 0.5,
                    fontSize: 13, italic: true, color: '4A3728', fontFace: '微软雅黑'
                });
            }

            // === 右侧区域 ===
            var rightX = 9.0;
            var rightW = 4.1;

            // 特性卡片
            var traitY = 0.3;
            slide.addShape(pptx.ShapeType.roundRect, {
                x: rightX, y: traitY, w: rightW, h: 2.8,
                fill: { color: 'FFFFFF', transparency: 12 },
                shadow: { type: 'outer', blur: 6, offset: 2, color: '000000', opacity: 0.05 },
                rectRadius: 0.12
            });
            slide.addText(sd.icon + ' ' + wd.element + '行特性', {
                x: rightX + 0.15, y: traitY + 0.1, w: 3, h: 0.35,
                fontSize: 15, bold: true, color: tc, fontFace: '微软雅黑'
            });
            // 底部分割线
            slide.addShape(pptx.ShapeType.rect, {
                x: rightX + 0.15, y: traitY + 0.48, w: rightW - 0.3, h: 0.02,
                fill: { color: c(mc), transparency: 60 }
            });

            wd.traits.forEach(function(trait, ti) {
                slide.addText('●  ' + trait, {
                    x: rightX + 0.15, y: traitY + 0.58 + ti * 0.42, w: rightW - 0.3, h: 0.4,
                    fontSize: 12, color: '4A3728', fontFace: '微软雅黑',
                    valign: 'top'
                });
            });

            // 中药卡片
            var herbY = traitY + 3.0;
            slide.addShape(pptx.ShapeType.roundRect, {
                x: rightX, y: herbY, w: rightW, h: 2.0,
                fill: { color: 'FFFFFF', transparency: 12 },
                shadow: { type: 'outer', blur: 6, offset: 2, color: '000000', opacity: 0.05 },
                rectRadius: 0.12
            });
            slide.addText('常用中药', {
                x: rightX + 0.15, y: herbY + 0.1, w: 3, h: 0.35,
                fontSize: 15, bold: true, color: tc, fontFace: '微软雅黑'
            });
            slide.addShape(pptx.ShapeType.rect, {
                x: rightX + 0.15, y: herbY + 0.48, w: rightW - 0.3, h: 0.02,
                fill: { color: c(mc), transparency: 60 }
            });

            var herbCols = 3;
            var herbCellW = (rightW - 0.3) / herbCols;
            wd.herbs.forEach(function(herb, hi) {
                var col = hi % herbCols;
                var row = Math.floor(hi / herbCols);
                var hx = rightX + 0.15 + col * herbCellW;
                var hy = herbY + 0.58 + row * 0.7;

                // 小背景
                slide.addShape(pptx.ShapeType.roundRect, {
                    x: hx + 0.04, y: hy, w: herbCellW - 0.08, h: 0.6,
                    fill: { color: c(ec.bg) },
                    rectRadius: 0.06
                });
                slide.addText(herb.icon + ' ' + herb.name, {
                    x: hx + 0.04, y: hy, w: herbCellW - 0.08, h: 0.6,
                    fontSize: 12, bold: true, color: '5C4033', align: 'center', valign: 'middle', fontFace: '微软雅黑'
                });
            });

            // 养生建议卡片
            var tipY = herbY + 2.2;
            slide.addShape(pptx.ShapeType.roundRect, {
                x: rightX, y: tipY, w: rightW, h: 2.2,
                fill: { color: 'FFFFFF', transparency: 12 },
                shadow: { type: 'outer', blur: 6, offset: 2, color: '000000', opacity: 0.05 },
                rectRadius: 0.12
            });
            slide.addText('养生建议', {
                x: rightX + 0.15, y: tipY + 0.1, w: 3, h: 0.35,
                fontSize: 15, bold: true, color: tc, fontFace: '微软雅黑'
            });
            slide.addShape(pptx.ShapeType.rect, {
                x: rightX + 0.15, y: tipY + 0.48, w: rightW - 0.3, h: 0.02,
                fill: { color: c(mc), transparency: 60 }
            });

            wd.healthTips.forEach(function(tip, ti) {
                slide.addText('▸ ' + tip, {
                    x: rightX + 0.15, y: tipY + 0.58 + ti * 0.5, w: rightW - 0.3, h: 0.45,
                    fontSize: 11, color: '4A3728', fontFace: '微软雅黑',
                    valign: 'top'
                });
            });
        }

        // 全屏放映（使用美化后的generateSlideHTML）
        function startSlideshow() {
            const overlay = document.createElement('div');
            overlay.id = 'slideshowOverlay';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;';

            let slideIdx = 0;
            function showSlide(idx) {
                const slide = slides[idx];
                if (!slide) return;
                const slideHTML = generateSlideHTML(slide);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = slideHTML;
                const slideEl = tempDiv.firstElementChild;
                if (!slideEl) return;

                // 让幻灯片铺满屏幕（保持16:9）
                slideEl.style.width = 'min(100vw, 177.78vh)';
                slideEl.style.height = 'min(100vh, 56.25vw)';
                slideEl.style.margin = 'auto';

                // 添加页码指示器
                const indicator = document.createElement('div');
                indicator.style.cssText = 'position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:14px;color:rgba(255,255,255,0.5);font-family:sans-serif;pointer-events:none;';
                indicator.textContent = (idx + 1) + ' / ' + slides.length + '  \u00B7  ESC \u9000\u51FA  \u00B7  \u2190\u2192 \u5207\u6362';
                slideEl.appendChild(indicator);

                overlay.innerHTML = '';
                overlay.appendChild(slideEl);
            }

            showSlide(slideIdx);
            document.body.appendChild(overlay);

            overlay.addEventListener('click', function() {
                slideIdx = (slideIdx + 1) % slides.length;
                showSlide(slideIdx);
            });

            document.addEventListener('keydown', function handler(e) {
                if (e.key === 'Escape') {
                    overlay.remove();
                    document.removeEventListener('keydown', handler);
                } else if (e.key === 'ArrowRight' || e.key === ' ') {
                    slideIdx = (slideIdx + 1) % slides.length;
                    showSlide(slideIdx);
                } else if (e.key === 'ArrowLeft') {
                    slideIdx = (slideIdx - 1 + slides.length) % slides.length;
                    showSlide(slideIdx);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 优先级1: 工作台同步数据
            // 优先级2: 上次编辑持久化数据
            // 优先级3: 后端持久化数据
            // 优先级4: 默认幻灯片
            try {
                const raw = localStorage.getItem('tcm_ppt_sync');
                if (raw) {
                    const syncData = JSON.parse(raw);
                    if (syncData.source === 'workspace' && syncData.slides && syncData.slides.length > 0) {
                        slides = syncData.slides;
                        currentSlideIndex = 0;
                        localStorage.setItem('tcm_ppt_persist', JSON.stringify({ slides: slides, title: syncData.title }));
                        localStorage.removeItem('tcm_ppt_sync');
                    }
                } else {
                    // 没有新同步数据，尝试恢复上次编辑的内容
                    const persisted = localStorage.getItem('tcm_ppt_persist');
                    if (persisted) {
                        const pData = JSON.parse(persisted);
                        if (pData.slides && pData.slides.length > 0) {
                            slides = pData.slides;
                            currentSlideIndex = 0;
                        }
                    } else {
                        // localStorage 无数据，尝试从后端恢复
                        try {
                            var token = localStorage.getItem('token') || '';
                            var headers = {};
                            if (token) headers['Authorization'] = 'Bearer ' + token;
                            const resp = await fetch('/api/projects/default/slides', { headers: headers });
                            if (resp.ok) {
                                const result = await resp.json();
                                if (result.slides && result.slides.length > 0) {
                                    slides = result.slides;
                                    currentSlideIndex = 0;
                                }
                            }
                        } catch(e) {
                            console.warn('[PPT] 后端数据恢复失败:', e);
                        }
                    }
                }
                // 更新导航栏标题
                const navTitle = document.querySelector('.bg-amber-50 span.text-sm');
                if (navTitle) navTitle.textContent = (slides[0]?.title || 'PPT课件') + '.pptx';
                const navPage = document.querySelector('.bg-amber-50 span.text-xs');
                if (navPage) navPage.textContent = slides.length + '页';
            } catch(e) {
                console.warn('读取数据失败:', e);
            }

            saveToHistory();
            renderThumbnails();
            renderCurrentSlide();
            updateAISuggestions();
            updatePageInfo();

            // WebSocket 连接（用于实时协作）
            (function initPPTWebSocket() {
                var token = localStorage.getItem('token') || '';
                if (!token) return;
                try {
                    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    var ws = new WebSocket(protocol + '//' + location.host + '/ws?token=' + token);
                    ws.onopen = function() { window._pptWs = ws; };
                    ws.onmessage = function(event) {
                        try {
                            var msg = JSON.parse(event.data);
                            if (msg.type === 'remote_update' && msg.slides) {
                                slides = msg.slides;
                                renderThumbnails();
                                renderCurrentSlide();
                                saveToHistory();
                            }
                        } catch(e) {}
                    };
                    ws.onclose = function() {
                        window._pptWs = null;
                        // 指数退避重连
                        setTimeout(initPPTWebSocket, 5000);
                    };
                    ws.onerror = function() { ws.close(); };
                } catch(e) {}
            })();
        });
        function doLogout() { localStorage.removeItem('token'); window.location.href = 'tcm-login.html'; }
    </script>
